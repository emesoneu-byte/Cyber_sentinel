services:
  - type: web
    name: cybersentinel
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@example.com
      - key: ADMIN_PASSWORD
        value: Admin123!
      - key: DB_PATH
        value: /opt/render/project/src/data/cybersentinel.db
      - key: CORS_ORIGIN
        sync: false
      - key: TRACKING_BASE_URL
        sync: false
    disk:
      name: cybersentinel-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
